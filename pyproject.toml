[project]
name = "ServiceNow-Embed-RAG"
version = "0.1.0"
description = "A local, high-performance RAG-based ServiceNow ITSM assistant optimized for 16GB RAM machines using Ollama, ChromaDB, and LangChain."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.12",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
]

